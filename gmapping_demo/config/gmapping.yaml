slam_gmapping:
  ros__parameters:

    # Frames
    map_frame: map
    odom_frame: odom
    base_frame: base_link

    # Laser
    scan_topic: /scan

    # Map resolution
    delta: 0.05

    # Maximum laser range
    maxUrange: 12.0

    # Map update
    map_update_interval: 2.0

    # Minimum movement before update
    linearUpdate: 0.05
    angularUpdate: 0.05

    # Number of particles
    particles: 30

    # Scan matching
    maxRange: 12.0

    # Motion noise
    srr: 0.01
    srt: 0.02
    str: 0.01
    stt: 0.02